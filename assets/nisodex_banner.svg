<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="NISODEX — Full-Stack Developer">
  <defs>
    <style>
      .name {
        font-family: 'Space Grotesk', 'Arial Black', sans-serif;
        font-weight: 700;
        font-size: 72px;
        letter-spacing: 0.12em;
        fill: #FFFFFF;
      }
      .tagline {
        font-family: 'Inter', Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: 0.28em;
        fill: #555555;
      }
      .sub {
        font-family: 'Inter', Arial, sans-serif;
        font-weight: 400;
        font-size: 13px;
        letter-spacing: 0.15em;
        fill: #333333;
      }
    </style>
    <!-- Grid dot pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="19.5" y="19.5" width="1" height="1" fill="#1A1A1A"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="320" fill="#0A0A0A"/>

  <!-- Dot grid overlay -->
  <rect width="1280" height="320" fill="url(#grid)" opacity="1"/>

  <!-- Right-side geometric accent: large N outline -->
  <g opacity="0.04">
    <!-- Giant N strokes (decorative, right-aligned) -->
    <rect x="960" y="40" width="18" height="240" fill="#FFFFFF"/>
    <rect x="1130" y="40" width="18" height="240" fill="#FFFFFF"/>
    <polygon points="960,40 978,40 1148,245 1148,280 1130,280 960,75" fill="#FFFFFF"/>
  </g>

  <!-- Left accent bar -->
  <rect x="100" y="80" width="3" height="160" fill="#282828"/>

  <!-- Geometric N symbol (logo mark, left) -->
  <g transform="translate(120, 108)">
    <!-- Left vertical -->
    <rect x="0" y="0" width="10" height="104" fill="#E8E8E8"/>
    <!-- Right vertical -->
    <rect x="72" y="0" width="10" height="104" fill="#E8E8E8"/>
    <!-- Diagonal -->
    <polygon points="0,0 10,0 82,96 82,104 72,104 0,8" fill="#E8E8E8"/>
    <!-- Accent dot -->
    <rect x="78" y="94" width="10" height="10" fill="#FFFFFF"/>
  </g>

  <!-- Horizontal separator between symbol and text -->
  <rect x="225" y="120" width="1" height="80" fill="#222222"/>

  <!-- Main wordmark -->
  <text x="248" y="186" class="name">NISODEX</text>

  <!-- Tagline below -->
  <text x="252" y="228" class="tagline">FULL-STACK DEVELOPER</text>

  <!-- Bottom line + sub text -->
  <rect x="100" y="270" width="1080" height="1" fill="#1C1C1C"/>
  <text x="100" y="292" class="sub">CLEAN CODE  ·  CLEAR ARCHITECTURE  ·  MODERN STACK</text>

  <!-- Top-right corner accent lines -->
  <rect x="1160" y="0" width="1" height="80" fill="#1C1C1C"/>
  <rect x="1200" y="0" width="1" height="50" fill="#171717"/>
  <rect x="1160" y="80" width="120" height="1" fill="#1C1C1C"/>
</svg>
