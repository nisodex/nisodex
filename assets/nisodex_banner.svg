<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="NISODEX — Full-Stack &amp; Systems Developer">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlowCenter" cx="20%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141829" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#090b11" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050608" stop-opacity="1"/>
    </radialGradient>

    <radialGradient id="neonPulse" cx="15%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gradients for Monogram -->
    <linearGradient id="metalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="metalDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="metalRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="lineAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="gridPattern" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#181d2a" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="0.8" fill="#334155" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="320" fill="url(#bgGlowCenter)"/>
  <rect width="1280" height="320" fill="url(#neonPulse)"/>
  <rect width="1280" height="320" fill="url(#gridPattern)"/>

  <!-- Outer Tech Border -->
  <rect x="24" y="20" width="1232" height="280" rx="8" fill="none" stroke="#1e293b" stroke-width="1"/>
  <rect x="24" y="20" width="1232" height="280" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>

  <!-- Corner Tech Accents -->
  <path d="M 24 40 L 24 20 L 44 20" fill="none" stroke="#6366f1" stroke-width="2"/>
  <path d="M 1256 40 L 1256 20 L 1236 20" fill="none" stroke="#6366f1" stroke-width="2"/>
  <path d="M 24 280 L 24 300 L 44 300" fill="none" stroke="#6366f1" stroke-width="2"/>
  <path d="M 1256 280 L 1256 300 L 1236 300" fill="none" stroke="#6366f1" stroke-width="2"/>

  <!-- Top Telemetry Bar -->
  <g transform="translate(50, 48)">
    <circle cx="5" cy="5" r="3.5" fill="#10b981"/>
    <circle cx="5" cy="5" r="7" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
    <text x="18" y="9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" letter-spacing="0.15em" fill="#64748b">SYSTEM STATUS // ONLINE</text>
  </g>

  <g transform="translate(1070, 48)">
    <text x="0" y="9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="600" letter-spacing="0.2em" fill="#475569">0xNISODEX · V2.4</text>
  </g>

  <!-- Large Faded Background Watermark 'N' -->
  <g opacity="0.03" transform="translate(940, 30)">
    <rect x="0" y="0" width="28" height="260" fill="#ffffff"/>
    <rect x="180" y="0" width="28" height="260" fill="#ffffff"/>
    <polygon points="0,0 28,0 208,260 180,260" fill="#ffffff"/>
  </g>

  <!-- ==================== LOGO ICON: MONOGRAM 'N' ==================== -->
  <g transform="translate(75, 95)">
    <!-- Ambient Glow behind logo -->
    <rect x="0" y="0" width="105" height="130" fill="#6366f1" opacity="0.1" rx="8" filter="blur(10px)"/>

    <!-- Left Pillar -->
    <rect x="10" y="10" width="20" height="110" rx="2" fill="url(#metalLeft)"/>
    <rect x="28" y="10" width="2" height="110" fill="#ffffff" opacity="0.4"/>

    <!-- Diagonal Stroke -->
    <polygon points="10,10 30,10 95,120 75,120" fill="url(#metalDiag)"/>
    <!-- Diagonal Specular Highlight -->
    <polygon points="10,10 14,10 79,120 75,120" fill="#ffffff" opacity="0.8"/>

    <!-- Right Pillar -->
    <rect x="75" y="10" width="20" height="110" rx="2" fill="url(#metalRight)"/>
    <rect x="75" y="10" width="2" height="110" fill="#000000" opacity="0.3"/>

    <!-- Neon Core Accent Dot -->
    <rect x="85" y="108" width="10" height="12" rx="1" fill="url(#neonAccent)"/>
    <circle cx="90" cy="114" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Vertical Divider Bar -->
  <line x1="210" y1="90" x2="210" y2="235" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="210" y1="125" x2="210" y2="200" stroke="#6366f1" stroke-width="1.5" opacity="0.8"/>

  <!-- ==================== MAIN TYPOGRAPHY & WORDMARK ==================== -->
  <g transform="translate(240, 95)">
    <!-- Wordmark NISODEX (Clean, Crisp, System-Native Typography) -->
    <text x="0" y="60" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="0.12em" fill="#f8fafc">
      NISODEX
    </text>

    <!-- Glowing Accent Dot at end of wordmark -->
    <circle cx="340" cy="48" r="4.5" fill="#6366f1"/>
    <circle cx="340" cy="48" r="8" fill="none" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Tagline / Subtitle -->
    <text x="2" y="90" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600" letter-spacing="0.28em" fill="#94a3b8">
      FULL-STACK &amp; SYSTEMS DEVELOPER
    </text>

    <!-- Glowing Divider -->
    <line x1="2" y1="104" x2="680" y2="104" stroke="url(#lineAccent)" stroke-width="1.5"/>

    <!-- Skill / Architecture Chips -->
    <g transform="translate(2, 118)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="98" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="15" font-family="system-ui, -apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#cbd5e1">WEB &amp; APIS</text>

      <!-- Chip 2 -->
      <rect x="108" y="0" width="102" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="120" y="15" font-family="system-ui, -apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#cbd5e1">MOBILE APPS</text>

      <!-- Chip 3 -->
      <rect x="220" y="0" width="118" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="232" y="15" font-family="system-ui, -apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#cbd5e1">SYSTEMS &amp; CLI</text>

      <!-- Chip 4 -->
      <rect x="348" y="0" width="132" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
      <text x="360" y="15" font-family="system-ui, -apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#cbd5e1">ANDROID MODDING</text>

      <!-- Chip 5 (Highlight) -->
      <rect x="490" y="0" width="118" height="22" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="0.8"/>
      <text x="502" y="15" font-family="system-ui, -apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="700" fill="#a5b4fc">OPEN SOURCE</text>
    </g>
  </g>

  <!-- Bottom Right Spec -->
  <g transform="translate(1020, 268)">
    <text x="0" y="0" font-family="system-ui, -apple-system, BlinkMacSystemFont, monospace" font-size="10" font-weight="600" letter-spacing="0.12em" fill="#475569">BUILT WITH PRECISION</text>
    <text x="0" y="14" font-family="system-ui, -apple-system, BlinkMacSystemFont, monospace" font-size="9" font-weight="500" letter-spacing="0.15em" fill="#334155">ES // 40.4168° N, 3.7038° W</text>
  </g>
</svg>
