<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="NISODEX">
  <defs>
    <linearGradient id="logoMetalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="logoNeonDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="320" height="80" fill="#08090c" rx="8" stroke="#1e293b" stroke-width="1"/>

  <!-- Logo Mark (N) -->
  <g transform="translate(18, 16)">
    <!-- Left Column -->
    <rect x="6" y="6" width="6" height="36" rx="1" fill="url(#logoMetalDark)"/>
    <!-- Diagonal Bridge -->
    <polygon points="6,6 12,6 36,42 30,42" fill="url(#logoMetalDark)"/>
    <polygon points="6,6 8,6 32,42 30,42" fill="#ffffff" opacity="0.6"/>
    <!-- Right Column -->
    <rect x="30" y="6" width="6" height="36" rx="1" fill="url(#logoMetalDark)"/>
    <!-- Neon Dot -->
    <rect x="32" y="38" width="4" height="4" fill="url(#logoNeonDark)"/>
  </g>

  <!-- Divider line -->
  <line x1="68" y1="20" x2="68" y2="60" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="68" y1="30" x2="68" y2="50" stroke="#6366f1" stroke-width="1.5" opacity="0.7"/>

  <!-- Typography -->
  <text x="80" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" letter-spacing="0.14em" fill="#f8fafc">
    NISODEX
  </text>
  <circle cx="218" cy="38" r="2.5" fill="#6366f1"/>

  <text x="81" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.22em" fill="#64748b">
    SYSTEMS &amp; FULL-STACK
  </text>
</svg>
